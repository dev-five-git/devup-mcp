<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>devup-mcp render harness</title>
    <!-- The fonts the design uses. Figma renders the same families. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=block" />
      <style>
        /* The reset itself is `@devup-ui/reset-css`, imported by `main.tsx`:
           the generated code is written against it, and guessing at one here
           got the two things it settles wrong - a root line-height of 1.5
           rather than the browser's own, and images left inline with
           `vertical-align: middle` rather than forced to `display: block`.
           What stays here is only what the capture needs. */
        html, body { background: transparent; }
        body { font-family: Pretendard, "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
        /* The comparison is of a still: nothing may move between the ready
           signal and the capture. */
        *, *::before, *::after { animation: none !important; transition: none !important; caret-color: transparent !important; }
      </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
