<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>layout</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  main { width: 600px; margin: 0 auto; }
  .row { display: flex; align-items: flex-start; gap: 20px; padding: 20px; }
  .card { width: 160px; height: 100px; background: #eee; flex: none; }
  .moved { margin-top: 60px; }
  .cta { background: #222; color: #fff; padding: 8px; border: 0; transition: background-color 0.15s ease; }
  .cta:hover { background: #555; }
  .cta:focus-visible { outline: 2px solid #09f; outline-offset: 2px; }
  .flat { color: #222; }
  .clip { width: 60px; overflow: hidden; white-space: nowrap; }
  .ellipsis { width: 60px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
</style></head>
<body>
<main data-figma-node-id="1:1">
  <section class="row" data-figma-node-id="1:2">
    <div class="card" data-figma-node-id="1:3"></div>
    <div class="card moved" data-figma-node-id="1:4"></div>
    <svg data-figma-node-id="1:5" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#333" stroke-width="2"/></svg>
  </section>
  <section data-figma-node-id="1:6">
    <button class="cta">Send</button>
    <a class="flat" href="#x">Plain link</a>
    <p class="clip">Text that is far too long</p>
    <p class="ellipsis">Text that is far too long</p>
  </section>
</main>
</body>
</html>
