[package]
name = "devup-mcp-figma"
description = "Read-only Figma Remote MCP client, OAuth, and exhaustive snapshots for devup-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
# `ws` 는 기본 기능이 아니다. 브리지가 플러그인을 받는 데 쓴다.
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
# 중계 연결의 WebSocket 클라이언트가 스트림으로 읽고 쓴다.
futures-util.workspace = true
# 중계 연결의 증명(HMAC-SHA256). sha2 와 같은 digest 세대다.
hmac.workspace = true
image.workspace = true
keyring.workspace = true
rand.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
# 포트를 잡지 못한 프로세스가 잡은 프로세스에 붙는 클라이언트. 테스트의 가짜
# 플러그인도 이것을 쓴다.
tokio-tungstenite.workspace = true
url.workspace = true
unicode-normalization.workspace = true
webbrowser.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile = "3"
