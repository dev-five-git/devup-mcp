[package]
name = "devup-mcp"
description = "Rust-native MCP server for Figma to DevupUI workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
cap-std.workspace = true
devup-mcp-devup-ui = { path = "../devup-mcp-devup-ui" }
devup-mcp-figma = { path = "../devup-mcp-figma" }
dunce.workspace = true
rmcp.workspace = true
rand.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum.workspace = true
# Also a normal dependency. Tests need it too, to canonicalise an expected path
# the same way OutputPolicy does — std::fs::canonicalize would return a `\\?\`
# UNC path on Windows and never match.
dunce.workspace = true
reqwest.workspace = true
# `start_paused` lets a test watch the retry waits elapse without spending the
# minute they describe.
tokio = { workspace = true, features = ["test-util"] }
