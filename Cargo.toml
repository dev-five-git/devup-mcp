[workspace]
members = [
    "crates/devup-mcp",
    "crates/devup-mcp-figma",
    "crates/devup-mcp-devup-ui",
    "crates/devup-mcp-visual",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/dev-five-git/devup-mcp"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
cap-std = "4.0.3"
dunce = "1.0.5"
keyring = "4.2"
insta = { version = "1.48.0", features = ["glob", "json"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
oxc_allocator = "=0.148.0"
oxc_ast = "=0.148.0"
oxc_ast_visit = "=0.148.0"
oxc_parser = "=0.148.0"
oxc_span = "=0.148.0"
rand = "0.10"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
rmcp = { version = "3.2", features = ["server", "transport-io", "client", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
unicode-normalization = "0.1"
webbrowser = "1"

[profile.release]
lto = "thin"
strip = true
