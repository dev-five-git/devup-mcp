[workspace]
members = [
    "crates/devup-mcp",
    "crates/devup-mcp-figma",
    "crates/devup-mcp-devup-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dev-five-git/devup-mcp"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
keyring = "4.2"
insta = { version = "1.48.0", features = ["glob", "json"] }
rand = "0.10"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
rmcp = { version = "3.1", features = ["server", "transport-io", "client", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
unicode-normalization = "0.1"
webbrowser = "1"

[profile.release]
lto = "thin"
strip = true
